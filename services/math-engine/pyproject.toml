[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gradiekan-math-engine"
version = "0.1.0"
description = "Mesin matematika & pemodelan soal cerita GradieKAn (SymPy + FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "sympy>=1.13",
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
  "anthropic>=2.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
]

[project.scripts]
gradiekan-engine = "mathengine.cli:main"

[tool.setuptools.packages.find]
include = ["mathengine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
